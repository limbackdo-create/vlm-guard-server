<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ed">
  <title>다정한 한 편 — 마음을 보내는 가장 따뜻한 방법</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
    :root{--paper:#f7f3ed;--ink:#25322d;--muted:#6f7771;--sage:#6d806b;--sage2:#dce3d8;--line:#ddd9d1;--white:#fffdf9;--peach:#e9aa8c}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Apple SD Gothic Neo',sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:232px 1fr}
    .sidebar{position:fixed;inset:0 auto 0 0;width:232px;border-right:1px solid var(--line);padding:37px 24px;display:flex;flex-direction:column;background:rgba(247,243,237,.94);z-index:5}
    .brand{display:flex;align-items:center;gap:10px;font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700}.seal{width:36px;height:36px;border:1px solid var(--sage);border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--sage)}
    nav{display:grid;gap:7px;margin-top:54px}.nav{border:0;background:transparent;color:var(--muted);padding:12px 13px;border-radius:9px;display:flex;align-items:center;gap:12px;text-align:left;font-size:14px}.nav.active{background:var(--sage2);color:var(--ink);font-weight:600}.nav svg{width:18px}
    .sidebar-foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}.sidebar-foot b{display:block;color:var(--ink);font-family:'Noto Serif KR';font-size:13px;margin-bottom:4px}
    main{grid-column:2;padding:35px 5vw 60px;max-width:1280px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:52px}.date{font-size:13px;color:var(--muted);letter-spacing:.03em}.date b{display:block;font:600 22px 'Noto Serif KR';color:var(--ink);margin-top:5px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:white;font:600 15px 'Noto Serif KR'}
    .hero{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(300px,.78fr);gap:32px;align-items:stretch}.letter{background:var(--white);border:1px solid #e5e0d8;border-radius:5px;box-shadow:0 18px 45px rgba(56,61,54,.07);padding:57px 11%;position:relative;min-height:430px;overflow:hidden}.letter:before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--sage)}
    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--sage);text-transform:uppercase}.quote{font:500 clamp(25px,3vw,37px)/1.7 'Noto Serif KR',serif;letter-spacing:-.035em;margin:29px 0 33px;word-break:keep-all}.quote-mark{font:70px/1 Georgia;color:#cad4c6;position:absolute;right:36px;top:25px}.author{font:500 13px 'Noto Serif KR';color:var(--muted);padding-top:20px;border-top:1px solid var(--line)}
    .sendbox{background:#e4e9e0;border-radius:5px;padding:37px 32px;display:flex;flex-direction:column}.sendbox h2{font:600 22px 'Noto Serif KR';margin:0 0 9px}.sendbox>p{font:400 13px/1.7 'Noto Serif KR';color:#647065;margin:0 0 28px}.field{margin-bottom:16px}.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid #ccd3c8;background:rgba(255,255,255,.62);border-radius:4px;padding:13px 14px;color:var(--ink);outline:none}.field input:focus,.field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(109,128,107,.12)}.field textarea{height:80px;resize:none;line-height:1.5}.send{margin-top:auto;border:0;background:var(--ink);color:#fff;border-radius:4px;padding:15px;font-weight:600;display:flex;justify-content:center;gap:9px;transition:.2s}.send:hover{background:var(--sage);transform:translateY(-1px)}.small{font-size:11px;color:#788178;text-align:center;margin:12px 0 0}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:58px 0 20px}.section-head h2{font:600 22px 'Noto Serif KR';margin:0}.section-head p{font-size:13px;color:var(--muted);margin:7px 0 0}.shuffle{border:0;background:transparent;color:var(--sage);font-size:13px;font-weight:600;padding:8px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:rgba(255,253,249,.7);border:1px solid var(--line);border-radius:5px;padding:26px;min-height:183px;display:flex;flex-direction:column;transition:.2s;cursor:pointer}.card:hover{background:var(--white);transform:translateY(-3px);box-shadow:0 10px 25px rgba(56,61,54,.06)}.tag{font-size:10px;letter-spacing:.13em;color:var(--sage);font-weight:700}.card p{font:500 17px/1.75 'Noto Serif KR';margin:16px 0;word-break:keep-all}.card footer{font-size:11px;color:var(--muted);margin-top:auto;display:flex;justify-content:space-between}.arrow{font-size:16px;color:var(--sage)}
    .toast{position:fixed;left:calc(50% + 116px);bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:white;padding:13px 20px;border-radius:4px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    .mobilebar{display:none}.view{display:none}.view.active{display:block}.empty{padding:70px 25px;text-align:center;border:1px dashed var(--line);background:rgba(255,255,255,.3)}.empty .big{font:500 22px 'Noto Serif KR';margin-bottom:10px}.history-list{display:grid;gap:12px}.history-item{background:var(--white);border:1px solid var(--line);padding:20px 24px;display:grid;grid-template-columns:110px 1fr auto;gap:20px;align-items:center;font-size:13px}.history-item p{font:400 14px/1.6 'Noto Serif KR';margin:0}.history-item time,.history-item span{color:var(--muted)}
    @media(max-width:850px){.shell{display:block}.sidebar{display:none}main{padding:24px 18px 100px}.top{margin-bottom:28px}.hero{grid-template-columns:1fr}.letter{min-height:360px;padding:45px 9%}.sendbox{padding:28px}.cards{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;z-index:10;left:12px;right:12px;bottom:12px;background:rgba(37,50,45,.96);border-radius:12px;padding:7px;justify-content:space-around;box-shadow:0 12px 30px rgba(0,0,0,.2)}.mobilebar .nav{color:#bfc7c1;padding:8px 18px;display:grid;place-items:center;gap:2px;font-size:10px}.mobilebar .nav.active{color:white;background:rgba(255,255,255,.12)}.mobilebar .nav svg{width:17px}.toast{left:50%;bottom:82px}.history-item{grid-template-columns:1fr;gap:7px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="seal">花</span>다정한 한 편</div>
    <nav>
      <button class="nav active" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l9-8 9 8v9H3z"/><path d="M9 20v-6h6v6"/></svg>오늘의 한 편</button>
      <button class="nav" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/><path d="M4 5.5v14"/></svg>글 보관함</button>
      <button class="nav" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>보낸 기록</button>
    </nav>
    <div class="sidebar-foot"><b>매일 한 문장, 오래 남는 마음.</b>말로는 쑥스러웠던 마음을<br>좋은 글에 담아 전해보세요.</div>
  </aside>
  <main>
    <header class="top"><div class="date" id="date"></div><div class="avatar" title="나">나</div></header>
    <section class="view active" id="today">
      <div class="hero">
        <article class="letter"><span class="eyebrow">오늘의 문장 · 사랑</span><span class="quote-mark">“</span><div class="quote" id="mainQuote"></div><div class="author" id="mainAuthor"></div></article>
        <aside class="sendbox"><h2>당신의 마음을 더해보세요</h2><p>짧은 한마디를 곁들이면, 오늘의 문장이 우리만의 편지가 됩니다.</p><div class="field"><label for="email">받는 사람</label><input id="email" type="email" placeholder="아내의 이메일 주소" autocomplete="email"></div><div class="field"><label for="note">나의 한마디</label><textarea id="note" maxlength="160" placeholder="오늘도 당신이라서 참 고마워."></textarea></div><button class="send" id="sendBtn">메일로 마음 보내기 <span>↗</span></button><p class="small">메일 앱이 열리면 내용을 확인하고 보내주세요.</p></aside>
      </div>
      <div class="section-head"><div><h2>이런 글은 어때요?</h2><p>마음에 닿는 문장을 골라보세요.</p></div><button class="shuffle" id="shuffle">↻ 새 문장 보기</button></div>
      <div class="cards" id="suggestions"></div>
    </section>
    <section class="view" id="library"><div class="section-head"><div><h2>글 보관함</h2><p>아내에게 건네고 싶은 문장을 천천히 골라보세요.</p></div></div><div class="cards" id="libraryCards"></div></section>
    <section class="view" id="history"><div class="section-head"><div><h2>보낸 기록</h2><p>다정한 마음이 차곡차곡 쌓이는 곳이에요.</p></div></div><div id="historyContent"></div></section>
  </main>
</div>
<nav class="mobilebar"><button class="nav active" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 11l9-8 9 8v9H3z"/></svg>오늘</button><button class="nav" data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 016.5 17H20V3H6.5A2.5 2.5 0 004 5.5z"/></svg>보관함</button><button class="nav" data-view="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/></svg>기록</button></nav>
<div class="toast" id="toast"></div>
<script>
const writings=[
 {tag:'사랑',text:'사랑은 서로를 바라보는 것이 아니라, 함께 같은 방향을 바라보는 것이다.',author:'앙투안 드 생텍쥐페리'},
 {tag:'고마움',text:'당신과 함께한 평범한 하루가 내게는 가장 특별한 날입니다.',author:'다정한 한 편'},
 {tag:'동행',text:'좋은 날에는 함께 웃고, 힘든 날에는 더 가까이 걷는 것. 그것이 우리가 만든 사랑입니다.',author:'다정한 한 편'},
 {tag:'위로',text:'오늘 조금 지쳤다면 내 어깨에 기대어도 좋아요. 당신의 내일은 오늘보다 환할 거예요.',author:'다정한 한 편'},
 {tag:'행복',text:'행복은 멀리 있는 큰 사건이 아니라, 당신과 마주 앉아 나누는 따뜻한 차 한 잔입니다.',author:'다정한 한 편'},
 {tag:'약속',text:'서두르지 않아도 괜찮아요. 나는 언제나 당신의 속도에 맞춰 걷겠습니다.',author:'다정한 한 편'},
 {tag:'응원',text:'당신이 스스로를 의심하는 날에도, 나는 변함없이 당신을 믿고 있어요.',author:'다정한 한 편'},
 {tag:'일상',text:'당신이 있는 집으로 돌아가는 길은 언제나 하루 중 가장 설레는 길입니다.',author:'다정한 한 편'},
 {tag:'그리움',text:'곁에 있어도 문득 보고 싶은 사람, 내게 당신은 그런 사람입니다.',author:'다정한 한 편'}
];
let current=Number(localStorage.getItem('warm-current')||0)%writings.length;
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const escapeHtml=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setDate(){const d=new Date();$('#date').innerHTML=`${d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'})}<b>오늘, 마음을 전하는 날</b>`}
function selectWriting(i){current=i;localStorage.setItem('warm-current',i);const w=writings[i];$('#mainQuote').textContent=w.text;$('#mainAuthor').textContent='— '+w.author;showView('today');window.scrollTo({top:0,behavior:'smooth'})}
function card(w,i){return `<article class="card" data-index="${i}" tabindex="0"><span class="tag">${w.tag}</span><p>${w.text}</p><footer><span>${w.author}</span><span class="arrow">↗</span></footer></article>`}
function render(){selectWriting(current);$('#suggestions').innerHTML=[1,2,3].map(n=>card(writings[(current+n)%writings.length],(current+n)%writings.length)).join('');$('#libraryCards').innerHTML=writings.map(card).join('');bindCards();renderHistory()}
function bindCards(){$$('.card').forEach(el=>{const go=()=>selectWriting(Number(el.dataset.index));el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}})}
function showView(id){$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===id));if(id==='history')renderHistory()}
$$('.nav').forEach(n=>n.onclick=()=>showView(n.dataset.view));
$('#shuffle').onclick=()=>{current=(current+3)%writings.length;render();toast('새로운 문장을 골랐어요')};
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function histories(){try{return JSON.parse(localStorage.getItem('warm-history')||'[]')}catch{return[]}}
function renderHistory(){const h=histories();$('#historyContent').innerHTML=h.length?`<div class="history-list">${h.map(x=>`<div class="history-item"><time>${escapeHtml(x.date)}</time><p>${escapeHtml(x.text)}</p><span>${escapeHtml(x.email)}</span></div>`).join('')}</div>`:'<div class="empty"><div class="big">아직 보낸 글이 없어요.</div><div>오늘, 첫 번째 다정한 마음을 전해보세요.</div></div>'}
$('#sendBtn').onclick=()=>{const email=$('#email').value.trim(),note=$('#note').value.trim(),w=writings[current];if(!email||!/^\S+@\S+\.\S+$/.test(email)){toast('받는 사람의 이메일을 확인해주세요');$('#email').focus();return}const body=`${w.text}\n\n— ${w.author}\n\n${note?note+'\n\n':''}당신을 생각하며, 다정한 한 편에서 보냅니다.`;const h=histories();h.unshift({date:new Date().toLocaleDateString('ko-KR'),text:w.text,email});localStorage.setItem('warm-history',JSON.stringify(h.slice(0,30)));localStorage.setItem('warm-email',email);toast('메일 앱을 여는 중이에요');setTimeout(()=>location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('오늘, 당신에게 전하고 싶은 한 편')}&body=${encodeURIComponent(body)}`,400)};
$('#email').value=localStorage.getItem('warm-email')||'';setDate();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
