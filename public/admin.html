<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>100°10 AI 감시 — 관리자</title>
<style>
  :root{--bg:#0B0B0F;--surface:#16161D;--surface2:#1F1F29;--border:#2A2A36;
    --primary:#FF6B2C;--primary-soft:#FF8A5B;--accent:#FFC53D;
    --text:#F5F5F7;--dim:#A0A0AD;--danger:#FF5A5A;--warn:#FFC53D;--success:#3DDC97}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .logo{font-size:20px;font-weight:900}.logo b{color:var(--primary)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .sec{font-size:14px;font-weight:800;margin:0 0 12px}
  .btn{background:var(--surface2);border:1px solid var(--border);border-radius:9px;color:var(--text);
    font-weight:700;padding:9px 14px;font-size:13px;cursor:pointer}
  .btn.pri{background:var(--primary);border-color:var(--primary);color:#0B0B0F}
  input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);padding:10px 12px;font-size:13px;font-family:inherit;width:100%}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
  .stat .n{font-size:24px;font-weight:900;color:var(--primary)}
  .stat .l{font-size:11px;color:var(--dim);margin-top:3px}
  .bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>div{height:100%;background:var(--primary)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--dim);font-weight:700;padding:8px;border-bottom:1px solid var(--border)}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  .lv{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .lv.normal{background:rgba(61,220,151,.15);color:var(--success)}
  .lv.warn{background:rgba(255,197,61,.15);color:var(--warn)}
  .lv.alert{background:rgba(255,90,90,.15);color:var(--danger)}
  .hidden{display:none}
  .msg{color:var(--dim);font-size:13px;text-align:center;padding:20px}
  .err{color:var(--danger);font-size:13px}
  .login{max-width:380px;margin:80px auto}
  .key{background:var(--surface2);padding:10px;border-radius:8px;font-family:monospace;
    font-size:12px;word-break:break-all;color:var(--accent);margin-top:8px}
  a{color:var(--primary-soft)}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" class="wrap login">
  <div class="logo" style="text-align:center;margin-bottom:6px">100<b>°10</b> AI 감시</div>
  <div style="text-align:center;color:var(--dim);font-size:12px;margin-bottom:20px">관리자 로그인</div>
  <div class="card">
    <input id="email" type="email" placeholder="이메일" style="margin-bottom:9px"/>
    <input id="pw" type="password" placeholder="비밀번호" style="margin-bottom:12px"/>
    <button class="btn pri" id="loginBtn" style="width:100%">로그인</button>
    <div style="text-align:center;margin-top:12px">
      <a href="#" id="toSignup" style="font-size:12px">처음이신가요? 가입하기</a>
    </div>
    <div id="loginErr" class="err" style="margin-top:10px"></div>
  </div>
  <div class="card hidden" id="signupBox">
    <div class="sec">회원가입</div>
    <input id="sName" placeholder="상호명" style="margin-bottom:9px"/>
    <input id="sEmail" type="email" placeholder="이메일" style="margin-bottom:9px"/>
    <input id="sPw" type="password" placeholder="비밀번호 (8자 이상)" style="margin-bottom:9px"/>
    <input id="sPhone" placeholder="휴대폰 (알림 수신용)" style="margin-bottom:12px"/>
    <button class="btn pri" id="signupBtn" style="width:100%">가입하기</button>
    <div id="signupErr" class="err" style="margin-top:10px"></div>
  </div>
</div>

<!-- 대시보드 -->
<div id="app" class="wrap hidden">
  <header>
    <div class="logo">100<b>°10</b> AI 감시 <span style="font-size:12px;color:var(--dim);font-weight:600" id="who"></span></div>
    <button class="btn" id="logout">로그아웃</button>
  </header>

  <div class="card">
    <div class="sec">오늘 현황</div>
    <div class="grid">
      <div class="stat"><div class="n" id="stTotal">0</div><div class="l">감지 건수</div></div>
      <div class="stat"><div class="n" id="stAlert" style="color:var(--danger)">0</div><div class="l">경고</div></div>
      <div class="stat"><div class="n" id="stWarn" style="color:var(--warn)">0</div><div class="l">주의</div></div>
      <div class="stat"><div class="n" id="stIn" style="color:var(--success)">0</div><div class="l">입장</div></div>
      <div class="stat"><div class="n" id="stOut" style="color:var(--primary-soft)">0</div><div class="l">퇴장</div></div>
    </div>
  </div>

  <div class="card">
    <div class="sec">이번 달 사용량</div>
    <div id="usageBox" class="msg">불러오는 중…</div>
  </div>

  <div class="card">
    <div class="sec">등록 기기</div>
    <div id="devBox" class="msg">불러오는 중…</div>
    <div class="row" style="margin-top:12px">
      <input id="devName" placeholder="기기 이름 (예: 출입구 구형폰)" style="flex:1;min-width:180px"/>
      <select id="devMode" style="max-width:150px">
        <option value="big">일반 감시</option>
        <option value="small">벌레 감지</option>
        <option value="door">출입 카운터</option>
      </select>
      <button class="btn pri" id="addDev">+ 기기 등록</button>
    </div>
    <div id="newKey" class="hidden">
      <div style="font-size:12px;color:var(--accent);margin-top:12px">
        ▼ 이 키를 현장 앱에 입력하세요. 창을 닫으면 다시 볼 수 없습니다.
      </div>
      <div class="key" id="keyText"></div>
    </div>
  </div>

  <div class="card">
    <div class="sec">감지 기록</div>
    <div class="row" style="margin-bottom:12px">
      <select id="fLevel" style="max-width:150px">
        <option value="">전체</option>
        <option value="alert">경고만</option>
        <option value="warn">주의만</option>
        <option value="normal">정상만</option>
      </select>
      <button class="btn" id="reload">새로고침</button>
    </div>
    <div id="evBox" class="msg">불러오는 중…</div>
  </div>
</div>

<script>
var $=function(id){return document.getElementById(id);};
var token=localStorage.getItem('admin_token')||'';

function api(path,opt){
  opt=opt||{};
  opt.headers=Object.assign({'content-type':'application/json'},opt.headers||{});
  if(token) opt.headers.authorization='Bearer '+token;
  return fetch('/api/admin'+path,opt).then(function(r){
    // 서버가 빈 응답이나 HTML을 보내도 화면이 깨지지 않도록 안전하게 처리
    return r.text().then(function(txt){
      var j=null;
      if(txt){ try{ j=JSON.parse(txt); }catch(e){ j=null; } }
      if(!r.ok){
        throw new Error((j&&j.error) || ('서버 오류 '+r.status+
          (r.status>=500?' — 잠시 후 다시 시도하세요':'')));
      }
      if(j===null){
        throw new Error('서버가 응답을 보내지 않았습니다. 무료 서버가 깨어나는 중일 수 있으니 30초 뒤 새로고침해 주세요.');
      }
      return j;
    });
  }).catch(function(e){
    if(e instanceof TypeError) throw new Error('서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.');
    throw e;
  });
}

/* 로그인 */
$('toSignup').onclick=function(e){ e.preventDefault(); $('signupBox').classList.toggle('hidden'); };
$('loginBtn').onclick=function(){
  $('loginErr').textContent='';
  api('/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('pw').value})})
    .then(function(r){ token=r.token; localStorage.setItem('admin_token',token); start(r.tenant); })
    .catch(function(e){ $('loginErr').textContent=e.message; });
};
$('signupBtn').onclick=function(){
  $('signupErr').textContent='';
  api('/signup',{method:'POST',body:JSON.stringify({
    name:$('sName').value,email:$('sEmail').value,password:$('sPw').value,phone:$('sPhone').value})})
    .then(function(r){ token=r.token; localStorage.setItem('admin_token',token); start(r.tenant); })
    .catch(function(e){ $('signupErr').textContent=e.message; });
};
$('logout').onclick=function(){ localStorage.removeItem('admin_token'); location.reload(); };

function start(tenant){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  if(tenant) $('who').textContent='· '+tenant.name;
  loadAll();
  setInterval(loadAll,30000);   // 30초마다 자동 갱신
}

function loadAll(){ loadSummary(); loadEvents(); }

function loadSummary(){
  api('/summary').then(function(r){
    $('stTotal').textContent=r.today.total;
    $('stAlert').textContent=r.today.alerts;
    $('stWarn').textContent=r.today.warns;
    $('stIn').textContent=r.door.entered;
    $('stOut').textContent=r.door.exited;

    var u=r.usage;
    if(u){
      $('usageBox').innerHTML=
        '<div style="display:flex;justify-content:space-between;font-size:13px">'+
        '<span><b>'+u.planName+'</b></span>'+
        '<span>'+u.used.toLocaleString()+' / '+u.limit.toLocaleString()+'회 ('+u.percent+'%)</span></div>'+
        '<div class="bar"><div style="width:'+Math.min(100,u.percent)+'%;'+
          (u.percent>=90?'background:var(--danger)':(u.percent>=70?'background:var(--warn)':''))+'"></div></div>'+
        '<div style="font-size:11.5px;color:var(--dim);margin-top:8px">'+
        '남은 횟수 '+u.remaining.toLocaleString()+'회 · API 원가 '+Math.round(u.apiCost).toLocaleString()+'원'+
        (u.overageCalls>0 ? ' · 초과 '+u.overageCalls.toLocaleString()+'회('+Math.round(u.overageFee).toLocaleString()+'원)' : '')+
        '</div>';
    }

    if(!r.devices.length){ $('devBox').innerHTML='<div class="msg">등록된 기기가 없습니다.</div>'; return; }
    var h='<table><tr><th>이름</th><th>모드</th><th>현장</th><th>마지막 접속</th><th></th></tr>';
    r.devices.forEach(function(d){
      var mode={big:'일반 감시',small:'벌레 감지',door:'출입 카운터'}[d.detect_mode]||d.detect_mode;
      var seen=d.last_seen_at?new Date(d.last_seen_at).toLocaleString('ko-KR'):'—';
      h+='<tr><td><b>'+esc(d.name)+'</b></td><td>'+mode+'</td><td>'+esc(d.site_name||'—')+'</td>'+
         '<td style="color:var(--dim)">'+seen+'</td>'+
         '<td><button class="btn" data-del="'+d.id+'" style="padding:5px 10px;font-size:11px">삭제</button></td></tr>';
    });
    $('devBox').innerHTML=h+'</table>';
    Array.prototype.forEach.call($('devBox').querySelectorAll('[data-del]'),function(b){
      b.onclick=function(){
        if(!confirm('이 기기를 삭제할까요? 해당 앱은 더 이상 작동하지 않습니다.')) return;
        api('/devices/'+b.getAttribute('data-del'),{method:'DELETE'}).then(loadSummary);
      };
    });
  }).catch(function(e){
    if(String(e.message).indexOf('로그인')>=0){ localStorage.removeItem('admin_token'); location.reload(); return; }
    // 오류를 화면에 보여준다 (예전에는 "불러오는 중…"에서 멈춰 원인을 알 수 없었음)
    $('usageBox').innerHTML='<div class="err">'+esc(e.message)+'</div>';
    $('devBox').innerHTML='<div class="err">'+esc(e.message)+'</div>';
  });
}

$('addDev').onclick=function(){
  var name=$('devName').value.trim();
  if(!name) return alert('기기 이름을 입력하세요');
  api('/devices',{method:'POST',body:JSON.stringify({name:name,detectMode:$('devMode').value})})
    .then(function(r){
      $('devName').value='';
      $('newKey').classList.remove('hidden');
      $('keyText').textContent=r.device.device_key;
      loadSummary();
    }).catch(function(e){ alert(e.message); });
};

$('reload').onclick=loadEvents;
$('fLevel').onchange=loadEvents;

function loadEvents(){
  var lv=$('fLevel').value;
  api('/events?limit=50'+(lv?'&level='+lv:'')).then(function(r){
    if(!r.events.length){ $('evBox').innerHTML='<div class="msg">기록이 없습니다.</div>'; return; }
    var h='<table><tr><th>시각</th><th>기기</th><th>등급</th><th>상황</th><th>소요</th></tr>';
    r.events.forEach(function(e){
      var lab={normal:'✓ 정상',warn:'● 주의',alert:'⚠ 경고'}[e.level]||e.level;
      var dir=e.direction?(e.direction==='in'?' ⬅입장':' ➡퇴장')+(e.person_count||''):'';
      h+='<tr><td style="color:var(--dim);white-space:nowrap">'+new Date(e.created_at).toLocaleString('ko-KR')+'</td>'+
         '<td>'+esc(e.device_name)+'</td>'+
         '<td><span class="lv '+e.level+'">'+lab+'</span></td>'+
         '<td>'+esc(e.situation||'—')+dir+
           (e.image_path?' <a href="/api/admin/image/'+e.id+'" target="_blank">사진</a>':'')+'</td>'+
         '<td style="color:var(--dim)">'+(e.elapsed_ms?(e.elapsed_ms/1000).toFixed(1)+'초':'—')+'</td></tr>';
    });
    $('evBox').innerHTML=h+'</table>';
  }).catch(function(e){ $('evBox').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}

function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){
  return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }

if(token) start(null);
</script>
</body>
</html>
